# Render Blueprint: https://render.com/docs/blueprint-spec
# Render dashboard -> New -> Blueprint -> select this repo. Secrets marked `sync: false`
# are entered in the dashboard during setup; they are never stored in the repo.
services:
  - type: web
    name: rag-backend
    runtime: docker
    plan: free
    region: virginia  # same AWS region as the Neon database (us-east-1)
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ping
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: LLM_PROVIDER
        value: openai
      - key: EMBEDDING_PROVIDER
        value: openai
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: '["https://aidocumentassistant.vercel.app"]'
