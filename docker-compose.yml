services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://rag:rag@db:5432/rag
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Ingestion worker. Opt-in (it loads an embedding model into RAM):
  #   docker compose --profile ingest up -d worker
  worker:
    build: ./backend
    command: ["python", "-m", "app.ingestion.worker"]
    profiles: ["ingest"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://rag:rag@db:5432/rag
      MODEL_CACHE_DIR: /models
    volumes:
      - models:/models
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  models:
