name: Keep backend awake

# Render's free tier sleeps after 15 idle minutes and takes ~1 minute to wake, which is
# what a recruiter clicking the demo would hit. One always-on free service fits in
# Render's 750 free hours/month. /ping does not touch the database, so Neon can still
# scale to zero.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: vars.BACKEND_URL != ''
    steps:
      # A sleeping instance can answer with errors while it boots; retry through that.
      - run: >-
          curl --fail --silent --show-error --max-time 120
          --retry 6 --retry-delay 15 --retry-all-errors
          "${{ vars.BACKEND_URL }}/ping"
