name: Keep backend awake

# Render's free tier sleeps after 15 idle minutes and takes ~1 minute to wake, which is
# what a recruiter clicking the demo would hit. One always-on free service fits in
# Render's 750 free hours/month. /ping does not touch the database, so Neon can still
# scale to zero.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: vars.BACKEND_URL != ''
    steps:
      - run: curl --fail --silent --show-error --max-time 120 "${{ vars.BACKEND_URL }}/ping"
